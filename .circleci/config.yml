version: 2.1
############################################################################
parameters:
  package_name:
    type: string
    default: "auto"
    description: "Full path of the package to build, e.g. thirdparty/rsync or zimbra/osl. Leave as 'auto' to auto-detect changed package(s) from the latest commit."
  rebuild_reverse_deps:
    type: enum
    enum: ["off", "direct", "transitive"]
    default: "direct"
    description: "How far to walk consumers of a changed package: off (changed package only), direct (immediate consumers too - DEFAULT, e.g. clamav change also rebuilds mta-components), transitive (entire dependent stack)."
  pkg_repo_release:
    type: string
    default: "1010"
    description: "Zimbra package repo release line to enable inside build containers (e.g. 1010, 1000, 87). Published zimbra-* build deps are installed from this line instead of being rebuilt from source."
references:
  when_main_workflow: &when_main_workflow
    or:
      - equal: [ "api", "<< pipeline.trigger_source >>" ]
      - not:
          equal: [ "<< pipeline.git.branch >>", "testbranch" ]
  when_develop_workflow: &when_develop_workflow
    and:
      - equal: [ "<< pipeline.git.branch >>", "testbranch" ]
      - not:
          equal: [ "api", "<< pipeline.trigger_source >>" ]
  setup_pkg_repo_step: &setup_pkg_repo_step
    run:
        name: Configure Zimbra package repo
        environment:
          PKG_REPO_RELEASE: "<< pipeline.parameters.pkg_repo_release >>"
          APT_REPO_CANDIDATES: "https://repo.zimbra.com/apt http://repo-dev.eng.zimbra.com/apt"
          RPM_REPO_CANDIDATES: "https://repo.zimbra.com/rpm http://repo-dev.eng.zimbra.com/rpm"
          PKG_REPO_RELEASE_CANDIDATES: "<< pipeline.parameters.pkg_repo_release >> 1000 87"
          REQUIRE_PKGS: "zimbra-base"
          RPM_GPGCHECK: "0"
          PROBE_PKGS: "zimbra-base zimbra-openssl-dev zimbra-heimdal-dev zimbra-openssl-devel zimbra-heimdal-devel"
        command: bash ci/setup-pkg-repo.sh
  checkout_and_resolve_steps: &checkout_and_resolve_steps
    steps:
      - checkout:
          method: full
      - run:
          name: Generate dependency graph
          command: bash ci/generate-dependency-graph.sh dependency-graph.json
      - store_artifacts:
          path: dependency-graph.json
      - *setup_pkg_repo_step
      - run:
          name: Checkout build-tooling dependencies (siblings of ~/packages)
          command: |
            git clone -b develop --single-branch https://${GITHUB_ACCESS_TOKEN}:@github.com/Zimbra/zm-pkg-tool.git ~/zm-pkg-tool
            git clone -b master --single-branch https://${GITHUB_ACCESS_TOKEN}:@github.com/Zimbra/zimbra-package-stub.git ~/zimbra-package-stub
            git clone -b master --single-branch https://${GITHUB_ACCESS_TOKEN}:@github.com/Zimbra/zm-nexus.git ~/zm-nexus
      - run:
          name: Resolve package(s) to build
          command: |
            if [ "<< pipeline.parameters.package_name >>" != "auto" ]; then
              echo "<< pipeline.parameters.package_name >>" > packages_to_build.txt
            else
              git diff --name-only HEAD~1 HEAD -- thirdparty/ zimbra/ \
                | awk -F'/' '{print $1"/"$2}' \
                | sort -u > packages_to_build.txt
            fi
            if [ ! -s packages_to_build.txt ]; then
              echo "No package changes found in this commit - nothing to build."
              circleci-agent step halt
            fi
            REVERSE_DEPS_MODE="<< pipeline.parameters.rebuild_reverse_deps >>" \
              bash ci/resolve-build-order.sh packages_to_build.txt
            echo "=== Package(s) resolved for this run ==="
            cat packages_to_build.txt
      - persist_to_workspace:
          root: ..
          paths:
            - packages
            - zm-pkg-tool
            - zimbra-package-stub
            - zm-nexus
  build_and_isolate_steps: &build_and_isolate_steps
    steps:
      - attach_workspace:
          at: ..
      - run:
          name: Install build tooling + baseline dev libraries
          command: |
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              # libxml2-dev: ADDED. PHP's ./configure runs 'pkg-config libxml-2.0 >= 2.9.0'
              # (configure.ac --with-libxml-dir), which needs a system libxml-2.0.pc on
              # PKG_CONFIG_PATH. zimbra-libxml2-devel IS extracted by php's Makefile pkgadd
              # target, but into the zimbra custom prefix (OZC placeholders), not a path
              # pkg-config searches by default - see the PKG_CONFIG_PATH export added below
              # in the "Build resolved package(s)" step. Genesis builder images (u2287) bake
              # a system libxml2-dev in; devcore CI containers do not - same baseline-gap
              # pattern as cmake/libcurl-dev documented below for clamav. Missing this (and
              # the PKG_CONFIG_PATH export) caused build_u22/u24/c8/c9 to fail php with:
              #   checking for libxml-2.0 >= 2.9.0... no
              #   configure: error: Package requirements (libxml-2.0 >= 2.9.0) were not met
              #   Package 'libxml-2.0', required by 'virtual:world', not found
              # on pipeline #283 (commit 26e598e, httpd.spec change reverse-pulled php via
              # rebuild_reverse_deps=direct).
              sudo apt-get install -y --no-install-recommends \
                dpkg-dev build-essential cmake python3 \
                libssl-dev liblz4-dev zlib1g-dev libzstd-dev libexpat1-dev libxml2-dev \
                libcurl4-openssl-dev
            elif command -v yum >/dev/null 2>&1; then
              OS_VERSION=$(rpm -E %{rhel})
              if [ "$OS_VERSION" = "8" ]; then
                sudo sed -i \
                  -e 's/^mirrorlist=/#mirrorlist=/' \
                  -e 's/^metalink=/#metalink=/' \
                  -e 's|^#baseurl=http://mirror.centos.org|baseurl=https://vault.centos.org|' \
                  /etc/yum.repos.d/*.repo
              fi
              sudo yum install -y epel-release || true
              sudo yum config-manager --set-enabled powertools 2>/dev/null \
                || sudo yum config-manager --set-enabled PowerTools 2>/dev/null \
                || sudo yum config-manager --set-enabled crb 2>/dev/null \
                || true
              # libxml2-devel: ADDED, rpm analog of libxml2-dev above - same
              # 'Package libxml-2.0 not found' failure hit build_c8/build_c9 on
              # pipeline #283 for the same reason (php's configure pkg-config check).
              sudo yum install -y \
                rpm-build rpmdevtools createrepo cmake python3 \
                openssl-devel lz4-devel zlib-devel libzstd-devel expat-devel libxml2-devel \
                libcurl-devel \
                perl-libwww-perl perl-LWP-Protocol-https
              sudo yum install -y yum-plugin-priorities 2>/dev/null || true
            fi
      - *setup_pkg_repo_step
      - run:
          name: Build resolved package(s)
          command: |
            echo "Using PLATFORM_TAG=${PLATFORM_TAG}"
            mkdir -p build/dist_workspace/${PLATFORM_TAG}
            # PKG_CONFIG_PATH: ADDED. pkgadd extracts zimbra-libxml2-devel (and any other
            # zimbra-*-devel package a Makefile's pkgadd target pulls) into the zimbra
            # custom install prefix, NOT /usr - so a plain 'pkg-config libxml-2.0' never
            # finds it even though the package IS extracted (see php's build_u22/c9
            # failures on pipeline #283: 'Package libxml-2.0 not found' even after
            # zimbra-libxml2-devel is present under the extracted tree).
            # TODO: confirm the exact pkgconfig directory zm-pkg-tool's PKG_EXTRACT writes
            # to (commonly .../opt/zimbra/common/lib/pkgconfig going by the OZCL placeholder
            # convention used in clamav.spec/php.spec) and adjust the path below if different.
            export PKG_CONFIG_PATH="/opt/zimbra/common/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            install_declared_build_deps() {
              file="$1"; label="$2"; prefix="$3"; shift 3
              deps=$(awk -v prefix="$prefix" '
                  $0 ~ "^"prefix":" { flag=1; sub("^"prefix":", ""); print; next }
                  flag && /^[A-Za-z][A-Za-z0-9-]*:/ { flag=0 }
                  flag { print }
                ' "$file" \
                | tr ',' '\n' \
                | sed -E 's/\(.*\)//; s/[<>=!].*//; s/^[[:space:]]+//; s/[[:space:]]+$//' \
                | grep -v '^$' \
                | sort -u || true)
              if [ -n "$deps" ]; then
                echo "Installing ${label} build-deps: ${deps}"
                "$@" $deps
              else
                echo "No ${label} build-deps declared for ${file}, skipping install"
              fi
            }
            while IFS= read -r PKGPATH; do
              echo "=== Building ${PKGPATH} for ${PLATFORM_TAG} ==="
              if [ ! -d "$PKGPATH" ]; then
                echo "ERROR: $PKGPATH does not exist"
                exit 1
              fi
              PRE_HOOK="${PKGPATH}/ci/pre_build.sh"
              if [ -x "$PRE_HOOK" ]; then
                echo "=== Running pre-build hook for ${PKGPATH} ==="
                "$PRE_HOOK" "${PLATFORM_TAG}"
              fi
              CONTROL_FILE=$(find "$PKGPATH" -path "*/debian/control" 2>/dev/null | head -1)
              if [ -n "$CONTROL_FILE" ] && command -v apt-get >/dev/null 2>&1; then
                bash ci/verify-build-deps.sh "$CONTROL_FILE" "Build-Depends"
                install_declared_build_deps "$CONTROL_FILE" "Debian" "Build-Depends" \
                  sudo apt-get install -y --no-install-recommends
              fi
              SPEC_FILE=$(find "$PKGPATH" -path "*/SPECS/*.spec" 2>/dev/null | head -1)
              if [ -n "$SPEC_FILE" ] && command -v yum >/dev/null 2>&1; then
                bash ci/verify-build-deps.sh "$SPEC_FILE" "BuildRequires"
                install_declared_build_deps "$SPEC_FILE" "RPM" "BuildRequires" \
                  sudo yum install -y
              fi
              ( cd "$PKGPATH" && make )
              bash ci/register-local-repo.sh "${PKGPATH}/build"
              if grep -qxF "$PKGPATH" packages_to_publish.txt 2>/dev/null; then
                find "${PKGPATH}/build" -type f \
                  \( -name "*.deb" -o -name "*.rpm" \) ! -name "*.src.rpm" \
                  -exec cp {} "build/dist_workspace/${PLATFORM_TAG}/" \;
              else
                echo "=== ${PKGPATH} was built as a build-time-only prerequisite for this run - not copying to publish artifacts ==="
              fi
            done < packages_to_build.txt
            echo "=== build/dist_workspace/${PLATFORM_TAG} contents ==="
            ls -la build/dist_workspace/${PLATFORM_TAG}/
      - store_artifacts:
          path: build/dist_workspace
      - persist_to_workspace:
          root: ..
          paths:
            - packages/build/dist_workspace
  publish_packages_job_steps: &publish_packages_job_steps
    steps:
      - attach_workspace:
          at: ..
      - run:
          name: Publish package artifacts to Nexus
          command: |
            sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl
            bash ../zm-nexus/scripts/publish-packages-to-nexus.sh "build/dist_workspace"
  deploy_s3_job_steps: &deploy_s3_job_steps
    docker:
      - image: 'cimg/python:3.10'
    resource_class: small
    steps:
      - attach_workspace:
          at: ..
      - run:
          name: Create a zip file for artifacts and upload them to the OCI bucket
          command: |
            cd build/dist_workspace
            zip -r $CIRCLE_PROJECT_REPONAME.zip .
            ZIP_FILE_PATH="$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/$CIRCLE_BRANCH-$CIRCLE_BUILD_NUM/archives/$CIRCLE_PROJECT_REPONAME.zip"
            curl -X PUT "$OCI_PAR_URL$ZIP_FILE_PATH" -T $CIRCLE_PROJECT_REPONAME.zip
            echo "artifacts uploaded to $ZIP_FILE_PATH"
###########################################################################################################################################################
jobs:
  checkout_and_resolve:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    environment:
       ZIMBRA_REPO_PROBE_URL: "https://repo.zimbra.com/apt/1010/dists/jammy/Release"
    circleci_ip_ranges: true
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: small
    <<: *checkout_and_resolve_steps
  build_u24:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    circleci_ip_ranges: true
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-24.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: u24
    <<: *build_and_isolate_steps
  build_u22:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    circleci_ip_ranges: true
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: u22
    <<: *build_and_isolate_steps
  build_u20:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    circleci_ip_ranges: true
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-20.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: u20
    <<: *build_and_isolate_steps
  build_c9:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    circleci_ip_ranges: true
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-centos-9
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: c9
    <<: *build_and_isolate_steps
  build_c8:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    circleci_ip_ranges: true
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-centos-8
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: c8
    <<: *build_and_isolate_steps
  publish_packages:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    circleci_ip_ranges: true
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: small
    <<: *publish_packages_job_steps
  deploy_s3:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    <<: *deploy_s3_job_steps
###########################################################################################################################################################
workflows:
  version: 2
  develop-workflow:
    when: *when_develop_workflow
    jobs:
      - checkout_and_resolve:
          context:
            - docker-dev-registry
      - build_u24:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_u22:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_u20:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_c9:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_c8:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - publish_packages_hold:
          type: approval
          requires:
            - build_u24
            - build_u22
            - build_u20
            - build_c9
            - build_c8
      - publish_packages:
          requires:
            - publish_packages_hold
          context:
            - docker-dev-registry
            - nexus-dev-artifactory
  main:
    when: *when_main_workflow
    jobs:
      - generate:
          type: approval
      - checkout_and_resolve:
          requires:
            - generate
          context:
            - docker-dev-registry
      - build_u24:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_u22:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_u20:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_c9:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_c8:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - deploy_s3_hold:
          type: approval
          requires:
            - build_u24
            - build_u22
            - build_u20
            - build_c9
            - build_c8
      - deploy_s3:
          context:
            - oracle
            - docker-dev-registry
          requires:
            - deploy_s3_hold
