version: 2.1
############################################################################
parameters:
  package_name:
    type: string
    default: "auto"
    description: "Full path of the package to build, e.g. thirdparty/rsync or zimbra/osl. Leave as 'auto' to auto-detect changed package(s) from the latest commit."
  rebuild_reverse_deps:
    type: enum
    enum: ["off", "direct", "transitive"]
    # DEFAULT CHANGED "off" -> "direct".
    # A push that changes a package must also rebuild (and republish) that
    # package's IMMEDIATE consumers in the SAME run, so bumping thirdparty/clamav
    # automatically pulls zimbra/mta-components - which declares zimbra-clamav in
    # its runtime Depends:/Requires: - into the build order right after clamav and
    # rebuilds it against the freshly-built clamav.
    # With the previous "off" default resolve-build-order.sh never reverse-expanded,
    # so a clamav-only commit (pipeline #257) resolved to just thirdparty/clamav and
    # zimbra/mta-components was never triggered. Reverse-matching keys on the binary
    # names a package PRODUCES (produced_names) against what candidates DECLARE
    # (declared_dep_names, which reads runtime Depends:/Requires: as well as the
    # build-time fields), which is exactly how the runtime-only clamav->mta-components
    # edge is discovered - forward expansion alone can never find it.
    # "direct" walks one level (immediate consumers of the changed package only, from
    # the seeds); pass "off" per-run to build strictly the changed package, or
    # "transitive" to rebuild the entire dependent stack (expensive).
    default: "direct"
    description: "How far to walk consumers of a changed package: off (changed package only), direct (immediate consumers too - DEFAULT, e.g. clamav change also rebuilds mta-components), transitive (entire dependent stack)."
  pkg_repo_release:
    type: string
    default: "1010"
    description: "Zimbra package repo release line to enable inside build containers (e.g. 1010, 1000, 87). Published zimbra-* build deps are installed from this line instead of being rebuilt from source."
references:
  when_main_workflow: &when_main_workflow
    or:
      - equal: [ "api", "<< pipeline.trigger_source >>" ]
      - not:
          equal: [ "<< pipeline.git.branch >>", "testbranch" ]
  when_develop_workflow: &when_develop_workflow
    and:
      - equal: [ "<< pipeline.git.branch >>", "testbranch" ]
      - not:
          equal: [ "api", "<< pipeline.trigger_source >>" ]
  # ---------------------------------------------------------------------------
  # Configures the Zimbra package repo inside the container, mirroring what the
  # genesis builders have baked into their images:
  #   Ubuntu  /etc/apt/sources.list.d/zimbra.list
  #   RHEL    /etc/yum.repos.d/zimbra.repo
  # Without this, apt-cache madison / yum list available return nothing for
  # zimbra-openssl-dev & friends, resolve-build-order.sh concludes "not
  # published", and forward expansion rebuilds OpenSSL and Heimdal from source
  # on every platform for a curl-only change.
  #
  # PUBLIC HOST FIRST. repo-dev.eng.zimbra.com is internal-only: pipeline #236
  # showed 'curl: (6) Could not resolve host' and 'Could not resolve
  # repo-dev.eng.zimbra.com' from every container. circleci_ip_ranges only pins
  # egress IPs for firewall allowlisting - it does not give the container Zimbra
  # DNS. repo-dev is kept as a second candidate so the same script does the right
  # thing on a self-hosted runner inside the network; the script probes in order
  # and uses the first base URL that actually serves this platform's tree.
  #
  # Referenced as a plain list item ('- *setup_pkg_repo_step') because the
  # *_steps anchors below are maps merged with '<<:', not lists.
  # ---------------------------------------------------------------------------
  setup_pkg_repo_step: &setup_pkg_repo_step
    run:
        name: Configure Zimbra package repo
        environment:
          PKG_REPO_RELEASE: "<< pipeline.parameters.pkg_repo_release >>"
          # Space-separated, highest priority first.
          APT_REPO_CANDIDATES: "https://repo.zimbra.com/apt http://repo-dev.eng.zimbra.com/apt"
          RPM_REPO_CANDIDATES: "https://repo.zimbra.com/rpm http://repo-dev.eng.zimbra.com/rpm"
          # Release lines tried in order. 1010 serves a 'focal' dist but does not
          # publish zimbra-base for it (pipeline #239, build_u20 -> exit 100), so
          # older platforms need to fall through to a line that does.
          PKG_REPO_RELEASE_CANDIDATES: "<< pipeline.parameters.pkg_repo_release >> 1000 87"
          # A release line is only accepted if these are actually present in it.
          # zimbra-base is never built by this pipeline - only fetched - so a line
          # missing it cannot produce a working build.
          REQUIRE_PKGS: "zimbra-base"
          # Genesis uses gpgcheck=1, but the Zimbra pubkey is not imported in the
          # devcore images. Set to 1 only after adding an 'rpm --import' step.
          RPM_GPGCHECK: "0"
          PROBE_PKGS: "zimbra-base zimbra-openssl-dev zimbra-heimdal-dev zimbra-openssl-devel zimbra-heimdal-devel"
        command: bash ci/setup-pkg-repo.sh
  checkout_and_resolve_steps: &checkout_and_resolve_steps
    steps:
      - checkout:
          method: full
      # Must run BEFORE resolve-build-order.sh, which probes dep resolvability.
      - *setup_pkg_repo_step
      - run:
          name: Checkout build-tooling dependencies (siblings of ~/packages)
          command: |
            git clone -b develop --single-branch https://${GITHUB_ACCESS_TOKEN}:@github.com/Zimbra/zm-pkg-tool.git ~/zm-pkg-tool
            git clone -b master --single-branch https://${GITHUB_ACCESS_TOKEN}:@github.com/Zimbra/zimbra-package-stub.git ~/zimbra-package-stub
            git clone -b master --single-branch https://${GITHUB_ACCESS_TOKEN}:@github.com/Zimbra/zm-nexus.git ~/zm-nexus
      - run:
          name: Resolve package(s) to build
          command: |
            if [ "<< pipeline.parameters.package_name >>" != "auto" ]; then
              echo "<< pipeline.parameters.package_name >>" > packages_to_build.txt
            else
              git diff --name-only HEAD~1 HEAD -- thirdparty/ zimbra/ \
                | awk -F'/' '{print $1"/"$2}' \
                | sort -u > packages_to_build.txt
            fi
            if [ ! -s packages_to_build.txt ]; then
              echo "No package changes found in this commit - nothing to build."
              circleci-agent step halt
            fi
            REVERSE_DEPS_MODE="<< pipeline.parameters.rebuild_reverse_deps >>" \
              bash ci/resolve-build-order.sh packages_to_build.txt
            echo "=== Package(s) resolved for this run ==="
            cat packages_to_build.txt
      - persist_to_workspace:
          root: ..
          paths:
            - packages
            - zm-pkg-tool
            - zimbra-package-stub
            - zm-nexus
  build_and_isolate_steps: &build_and_isolate_steps
    steps:
      - attach_workspace:
          at: ..
      - run:
          name: Install build tooling + baseline dev libraries
          command: |
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              # cmake: ClamAV (and other thirdparty pkgs) configure/build with CMake -
              # debian/rules override_dh_auto_configure runs 'cd cmake && cmake ..'. The
              # genesis builder image (u2287) has cmake baked into its baseline toolchain;
              # the devcore CI containers do not, so build_u20/u22/u24 died with
              #   /bin/sh: 1: cmake: not found
              #   make[2]: *** [debian/rules:12: override_dh_auto_configure] Error 127
              # cmake is a build TOOL (like build-essential), not a zimbra-* package, so it
              # is never installed by the per-package Build-Depends step - it must be baseline.
              # libcurl4-openssl-dev: now that cmake is present, clamav's CMake configure actually
              # runs and advances THROUGH every lib it finds (OpenSSL 3.5.1, ZLIB, BZip2, LibXml2,
              # PCRE2, Iconv, JSONC, Rust 1.98.0) to the next gate, CMakeLists.txt:546
              # find_package(CURL), which then failed:
              #   Could NOT find CURL (missing: CURL_LIBRARY CURL_INCLUDE_DIR)
              #   make[2]: *** [debian/rules:12: override_dh_auto_configure] Error 1
              # This is not a regression - it was simply never reached before, because the build
              # used to die earlier at 'cmake: not found'. clamav links libcurl (freshclam /
              # clamsubmit) but does NOT declare it in debian/control, and its cmake line passes no
              # -DCURL* override, so it relies on a SYSTEM libcurl-dev. Genesis (u2287) bakes that
              # in; the devcore CI images do not. Same baseline-gap as cmake/expat - not a zimbra-*
              # dep, so install_declared_build_deps never pulls it and it must live here.
              # python3: clamav's CMake also runs find_package(Python3 ... Interpreter) at
              # CMakeLists.txt:230. The Ubuntu images already ship /usr/bin/python3, so the deb
              # builds never tripped on it (only CentOS 8 did - see the yum branch below); it is
              # listed here purely to keep the apt and yum baselines in lockstep so a future base-
              # image change cannot silently reintroduce the gap on the deb side. It is a no-op on
              # today's Ubuntu images.
              sudo apt-get install -y --no-install-recommends \
                dpkg-dev build-essential cmake python3 \
                libssl-dev liblz4-dev zlib1g-dev libzstd-dev libexpat1-dev \
                libcurl4-openssl-dev
            elif command -v yum >/dev/null 2>&1; then
              OS_VERSION=$(rpm -E %{rhel})
              if [ "$OS_VERSION" = "8" ]; then
                sudo sed -i \
                  -e 's/^mirrorlist=/#mirrorlist=/' \
                  -e 's/^metalink=/#metalink=/' \
                  -e 's|^#baseurl=http://mirror.centos.org|baseurl=https://vault.centos.org|' \
                  /etc/yum.repos.d/*.repo
              fi
              sudo yum install -y epel-release || true
              sudo yum config-manager --set-enabled powertools 2>/dev/null \
                || sudo yum config-manager --set-enabled PowerTools 2>/dev/null \
                || sudo yum config-manager --set-enabled crb 2>/dev/null \
                || true
              # curl's %install runs 'make ca-bundle' -> lib/mk-ca-bundle.pl, which
              # needs perl(LWP::UserAgent) (+ https transport). RHEL images do not
              # ship it; the Ubuntu images do, which is why only c8/c9 failed at
              # 'generating a fresh ca-bundle.crt'. Install it for all rpm builds.
              # expat-devel: provides -lexpat, needed by apr-util (and hence
              # httpd's support/htpasswd.c). Not a zimbra-* package, so it is
              # never picked up by verify-build-deps.sh / the per-package
              # BuildRequires install step - it must be a baseline lib here,
              # same as openssl-devel. Missing this on RHEL8/9 caused:
              #   /usr/bin/ld: cannot find -lexpat
              #   make[3]: *** [Makefile:48: htpasswd] Error 1
              # on build_c8 and build_c9 (Ubuntu images link fine because
              # libexpat1-dev is already pulled in transitively there - it is
              # now installed explicitly below too, so that isn't relied on).
              # cmake: same baseline build tool as on the apt side above. clamav's
              # %build runs 'cd cmake && cmake ..'; without it build_c8/build_c9 died with
              #   cmake: command not found
              #   error: Bad exit status from /var/tmp/rpm-tmp.XXXX (%build)
              #   make: *** [Makefile:39: build_rpm] Error 1
              # libcurl-devel: the rpm analog of libcurl4-openssl-dev above. With cmake present the
              # %build cmake configure reaches CMakeLists.txt:546 find_package(CURL) and fails the
              # same way on c8/c9 (Could NOT find CURL -> Bad exit status from %build ->
              # make: *** [Makefile:39: build_rpm] Error 1). clamav needs system libcurl headers
              # that genesis bakes in but devcore lacks, and does not declare them - so baseline.
              # python3: clamav's CMake configure calls find_package(Python3 COMPONENTS Interpreter)
              # at CMakeLists.txt:230 - EARLIER in the file than the CURL check at :546. This gap is
              # PLATFORM-SPECIFIC to c8. RHEL/Rocky 9 (c9) and every Ubuntu image ship /usr/bin/python3
              # in their base, so c9 + u20/u22/u24 sailed past this line and built to completion; only
              # CentOS 8 lacks a cmake-discoverable interpreter (it carries /usr/libexec/platform-python,
              # which is not on PATH and not a name FindPython3 probes for), so build_c8 alone died with:
              #   Could NOT find Python3 (missing: Python3_EXECUTABLE Interpreter)
              #   CMakeLists.txt:230 (find_package) -> Configuring incomplete, errors occurred!
              #   error: Bad exit status from %build -> make: *** [Makefile:39: build_rpm] Error 1
              # It only became visible now because c8 has been stuck at this exact line since the cmake
              # fix let configure start - the CURL failures seen earlier were on the python3-having
              # platforms (they reach :546); with those four now green, c8's pre-existing python3 gap is
              # the last one still red. Installing the 'python3' rpm creates /usr/bin/python3, which
              # FindPython3 then locates. Like cmake/curl it is a genesis-baked build tool clamav does
              # not declare in BuildRequires, so it belongs in the baseline, not the per-package step.
              sudo yum install -y \
                rpm-build rpmdevtools createrepo cmake python3 \
                openssl-devel lz4-devel zlib-devel libzstd-devel expat-devel \
                libcurl-devel \
                perl-libwww-perl perl-LWP-Protocol-https
              sudo yum install -y yum-plugin-priorities 2>/dev/null || true
            fi
      # Deliberately AFTER the tooling step: on c8 that step repoints the dead
      # CentOS 8 mirrorlists at vault.centos.org and installs
      # yum-plugin-priorities. Running the repo setup first would make its
      # 'yum makecache' fail on c8 for unrelated reasons. Everything that needs
      # the zimbra repo (verify-build-deps.sh, install_declared_build_deps, and
      # the 'pkgadd' target inside make) runs in the next step.
      - *setup_pkg_repo_step
      - run:
          name: Build resolved package(s)
          command: |
            echo "Using PLATFORM_TAG=${PLATFORM_TAG}"
            mkdir -p build/dist_workspace/${PLATFORM_TAG}
            install_declared_build_deps() {
              file="$1"; label="$2"; prefix="$3"; shift 3
              deps=$(awk -v prefix="$prefix" '
                  $0 ~ "^"prefix":" { flag=1; sub("^"prefix":", ""); print; next }
                  flag && /^[A-Za-z][A-Za-z0-9-]*:/ { flag=0 }
                  flag { print }
                ' "$file" \
                | tr ',' '\n' \
                | sed -E 's/\(.*\)//; s/[<>=!].*//; s/^[[:space:]]+//; s/[[:space:]]+$//' \
                | grep -v '^$' \
                | sort -u || true)
              if [ -n "$deps" ]; then
                echo "Installing ${label} build-deps: ${deps}"
                "$@" $deps
              else
                echo "No ${label} build-deps declared for ${file}, skipping install"
              fi
            }
            while IFS= read -r PKGPATH; do
              echo "=== Building ${PKGPATH} for ${PLATFORM_TAG} ==="
              if [ ! -d "$PKGPATH" ]; then
                echo "ERROR: $PKGPATH does not exist"
                exit 1
              fi
              PRE_HOOK="${PKGPATH}/ci/pre_build.sh"
              if [ -x "$PRE_HOOK" ]; then
                echo "=== Running pre-build hook for ${PKGPATH} ==="
                "$PRE_HOOK" "${PLATFORM_TAG}"
              fi
              CONTROL_FILE=$(find "$PKGPATH" -path "*/debian/control" 2>/dev/null | head -1)
              if [ -n "$CONTROL_FILE" ] && command -v apt-get >/dev/null 2>&1; then
                bash ci/verify-build-deps.sh "$CONTROL_FILE" "Build-Depends"
                install_declared_build_deps "$CONTROL_FILE" "Debian" "Build-Depends" \
                  sudo apt-get install -y --no-install-recommends
              fi
              SPEC_FILE=$(find "$PKGPATH" -path "*/SPECS/*.spec" 2>/dev/null | head -1)
              if [ -n "$SPEC_FILE" ] && command -v yum >/dev/null 2>&1; then
                bash ci/verify-build-deps.sh "$SPEC_FILE" "BuildRequires"
                install_declared_build_deps "$SPEC_FILE" "RPM" "BuildRequires" \
                  sudo yum install -y
                # The spec's %changelog is the source of truth and is deliberately NOT
                # modified here. rpmbuild prints 'bogus date in %changelog' when a
                # weekday token does not match its date, but on the el8/el9 devcore
                # images that is a NON-FATAL warning: build #250 parsed the whole spec
                # and executed %install (make ca-bundle) despite that line, which proves
                # the parse did not abort. The real c8/c9 blocker was the missing
                # perl(LWP::UserAgent) for 'make ca-bundle', installed in the tooling
                # step above. Whatever weekday the spec author wrote is accepted as-is.
              fi
              ( cd "$PKGPATH" && make )
              bash ci/register-local-repo.sh "${PKGPATH}/build"
              if grep -qxF "$PKGPATH" packages_to_publish.txt 2>/dev/null; then
                find "${PKGPATH}/build" -type f \
                  \( -name "*.deb" -o -name "*.rpm" \) ! -name "*.src.rpm" \
                  -exec cp {} "build/dist_workspace/${PLATFORM_TAG}/" \;
              else
                echo "=== ${PKGPATH} was built as a build-time-only prerequisite for this run - not copying to publish artifacts ==="
              fi
            done < packages_to_build.txt
            echo "=== build/dist_workspace/${PLATFORM_TAG} contents ==="
            ls -la build/dist_workspace/${PLATFORM_TAG}/
      - store_artifacts:
          path: build/dist_workspace
      - persist_to_workspace:
          root: ..
          paths:
            - packages/build/dist_workspace
  publish_packages_job_steps: &publish_packages_job_steps
    steps:
      - attach_workspace:
          at: ..
      - run:
          name: Publish package artifacts to Nexus
          command: |
            sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl
            bash ../zm-nexus/scripts/publish-packages-to-nexus.sh "build/dist_workspace"
  deploy_s3_job_steps: &deploy_s3_job_steps
    docker:
      - image: 'cimg/python:3.10'
    resource_class: small
    steps:
      - attach_workspace:
          at: ..
      - run:
          name: Create a zip file for artifacts and upload them to the OCI bucket
          command: |
            cd build/dist_workspace
            zip -r $CIRCLE_PROJECT_REPONAME.zip .
            ZIP_FILE_PATH="$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/$CIRCLE_BRANCH-$CIRCLE_BUILD_NUM/archives/$CIRCLE_PROJECT_REPONAME.zip"
            curl -X PUT "$OCI_PAR_URL$ZIP_FILE_PATH" -T $CIRCLE_PROJECT_REPONAME.zip
            echo "artifacts uploaded to $ZIP_FILE_PATH"
###########################################################################################################################################################
jobs:
  checkout_and_resolve:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    environment:
       # Point at a real file, not a directory. The bare base URL returns 404
       # (pipeline #239: 'https://repo.zimbra.com/apt/1010 -> HTTP 404'), which
       # looks like a failure but only means the dir has no index.
       ZIMBRA_REPO_PROBE_URL: "https://repo.zimbra.com/apt/1010/dists/jammy/Release"
    circleci_ip_ranges: true
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: small
    <<: *checkout_and_resolve_steps
  build_u24:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    circleci_ip_ranges: true
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-24.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: u24
    <<: *build_and_isolate_steps
  build_u22:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    circleci_ip_ranges: true
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: u22
    <<: *build_and_isolate_steps
  build_u20:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    circleci_ip_ranges: true
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-20.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: u20
    <<: *build_and_isolate_steps
  build_c9:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    circleci_ip_ranges: true
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-centos-9
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: c9
    <<: *build_and_isolate_steps
  build_c8:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    circleci_ip_ranges: true
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-centos-8
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: c8
    <<: *build_and_isolate_steps
  publish_packages:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    circleci_ip_ranges: true
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: small
    <<: *publish_packages_job_steps
  deploy_s3:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    <<: *deploy_s3_job_steps
###########################################################################################################################################################
workflows:
  version: 2
  develop-workflow:
    when: *when_develop_workflow
    jobs:
      - checkout_and_resolve:
          context:
            - docker-dev-registry
      - build_u24:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_u22:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_u20:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_c9:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_c8:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - publish_packages_hold:
          type: approval
          requires:
            - build_u24
            - build_u22
            - build_u20
            - build_c9
            - build_c8
      - publish_packages:
          requires:
            - publish_packages_hold
          context:
            - docker-dev-registry
            - nexus-dev-artifactory
  main:
    when: *when_main_workflow
    jobs:
      - generate:
          type: approval
      - checkout_and_resolve:
          requires:
            - generate
          context:
            - docker-dev-registry
      - build_u24:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_u22:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_u20:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_c9:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_c8:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - deploy_s3_hold:
          type: approval
          requires:
            - build_u24
            - build_u22
            - build_u20
            - build_c9
            - build_c8
      - deploy_s3:
          context:
            - oracle
            - docker-dev-registry
          requires:
            - deploy_s3_hold
