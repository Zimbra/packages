version: 2.1
############################################################################

parameters:
  package_name:
    type: string
    default: "auto"
    description: "Full path of the package to build, e.g. thirdparty/rsync or zimbra/osl. Leave as 'auto' to auto-detect changed package(s) from the latest commit."

references:
  when_main_workflow: &when_main_workflow
    or:
      - equal: [ api, << pipeline.trigger_source >> ]
      - not:
          equal: [ << pipeline.git.branch >>, "testbranch" ]

  when_develop_workflow: &when_develop_workflow
    and:
      - equal: [ << pipeline.git.branch >>, "testbranch" ]
      - not:
          equal: [ api, << pipeline.trigger_source >> ]

  # ---------------------------------------------------------------------
  # 1) Checks out the repo (full history, needed for git diff)
  # 2) Clones the sibling tooling repos that package.def/Makefiles need
  #    (zimbra-package-stub is REQUIRED - package.def includes
  #     $(SRC_ROOT)/zimbra-package-stub/def/package.def, and SRC_ROOT
  #     resolves to the parent of this checkout, i.e. ~ )
  #    zm-pkg-tool provides bin/get_plat_tag.sh which auto-detects the
  #    platform, so we don't need to set BUILD_PLATFORM manually.
  # 3) Resolves WHICH package(s) to build. Packages can live under any
  #    top-level root (thirdparty/<pkg>, zimbra/<pkg>, etc.) - the
  #    resolved list stores the FULL relative path (e.g. "zimbra/osl"),
  #    never a bare name, so adding a package under a new root never
  #    requires touching this file. ci/resolve-build-order.sh then
  #    expands + orders that list (see that script for the
  #    auto-pull-in-dependents + topological sort logic).
  # ---------------------------------------------------------------------
  checkout_and_resolve_steps: &checkout_and_resolve_steps
    steps:
      - checkout:
          method: full
      - run:
          name: Checkout build-tooling dependencies (siblings of ~/packages)
          command: |
            git clone -b develop --single-branch https://${GITHUB_ACCESS_TOKEN}:@github.com/Zimbra/zm-pkg-tool.git ~/zm-pkg-tool
            git clone -b master --single-branch https://${GITHUB_ACCESS_TOKEN}:@github.com/Zimbra/zimbra-package-stub.git ~/zimbra-package-stub
            git clone -b master --single-branch https://${GITHUB_ACCESS_TOKEN}:@github.com/Zimbra/zm-nexus.git ~/zm-nexus
      - run:
          name: Resolve package(s) to build
          command: |
            if [ "<< pipeline.parameters.package_name >>" != "auto" ]; then
              echo "<< pipeline.parameters.package_name >>" > packages_to_build.txt
            else
              # Diff both known package roots - entries become full
              # paths like "thirdparty/nginx" or "zimbra/osl".
              git diff --name-only HEAD~1 HEAD -- thirdparty/ zimbra/ \
                | awk -F'/' '{print $1"/"$2}' \
                | sort -u > packages_to_build.txt
            fi

            if [ ! -s packages_to_build.txt ]; then
              echo "No package changes found in this commit - nothing to build."
              circleci-agent step halt
            fi

            bash ci/resolve-build-order.sh packages_to_build.txt

            echo "=== Package(s) resolved for this run ==="
            cat packages_to_build.txt
      - persist_to_workspace:
          root: ..
          paths:
            - packages
            - zm-pkg-tool
            - zimbra-package-stub
            - zm-nexus

  # ---------------------------------------------------------------------
  # Builds every resolved package for this platform via plain `make`.
  # Platform is auto-detected by zm-pkg-tool/bin/get_plat_tag.sh - no
  # manual BUILD_PLATFORM export needed.
  #
  # Everything in this step is PLATFORM-level, generic setup - it applies
  # the same way no matter which package is being built. Anything that
  # is specific to one package (like rsync's bionic/zstd issue) does NOT
  # belong here - it goes in that package's own <path>/ci/pre_build.sh
  # instead (see the build step below).
  #
  # Internal package->package dependencies (e.g. nginx needs openssl,
  # httpd needs apr/apr-util) are handled generically here via two
  # shared scripts - both are complete no-ops for a package that
  # declares no internal deps (e.g. zimbra/osl):
  #   - ci/verify-build-deps.sh : fails fast if a declared zimbra-*
  #     build-dep isn't resolvable yet (neither built earlier in this
  #     same job, nor already published).
  #   - ci/register-local-repo.sh : after each package builds, publishes
  #     it into a job-local apt/yum repo pinned above other sources, so
  #     a LATER package in the SAME job/commit picks it up immediately
  #     without waiting on Nexus.
  # ---------------------------------------------------------------------
  build_and_isolate_steps: &build_and_isolate_steps
    steps:
      - attach_workspace:
          at: ..

      - run:
          name: Configure Zimbra base package repo + diagnose
          command: |
            echo "=== Current apt/yum sources BEFORE fix ==="
            if command -v apt-get >/dev/null 2>&1; then
              cat /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
              echo "--- apt-cache policy zimbra-base (before) ---"
              apt-cache policy zimbra-base 2>&1 || true

              # This mirrors what the genesis dev server already has configured
              # (repo.zimbra.com/apt/87) which is where zimbra-base actually lives -
              # the CI base image apparently doesn't have this source baked in.
              echo "deb https://repo.zimbra.com/apt/87 focal/zimbra" | sudo tee /etc/apt/sources.list.d/zimbra-base.list
              sudo apt-get update -qq || true

              echo "--- apt-cache policy zimbra-base (after) ---"
              apt-cache policy zimbra-base 2>&1 || true

            elif command -v yum >/dev/null 2>&1; then
              echo "--- current yum repos ---"
              cat /etc/yum.repos.d/*.repo 2>/dev/null || true
              echo "--- yum list zimbra-base (before) ---"
              yum list zimbra-base 2>&1 || true

              cat <<REPOEOF | sudo tee /etc/yum.repos.d/zimbra-base.repo >/dev/null
[zimbra-base]
name=zimbra-base
baseurl=https://repo.zimbra.com/yum/87/\$releasever/zimbra
enabled=1
gpgcheck=0
REPOEOF
              sudo yum makecache -y || true

              echo "--- yum list zimbra-base (after) ---"
              yum list zimbra-base 2>&1 || true
            fi
      - run:
          name: Install build tooling + baseline dev libraries
          command: |
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              # dpkg-dev/build-essential: needed to build any .deb package.
              # libssl-dev/liblz4-dev/zlib1g-dev/libzstd-dev: baseline libs
              # several packages (e.g. rsync) assume are present without
              # declaring them in Build-Depends - see README section 3.4.2.
              sudo apt-get install -y --no-install-recommends \
                dpkg-dev build-essential \
                libssl-dev liblz4-dev zlib1g-dev libzstd-dev

            elif command -v yum >/dev/null 2>&1; then
              OS_VERSION=$(rpm -E %{rhel})

              if [ "$OS_VERSION" = "8" ]; then
                # CentOS 8 Linux reached EOL Dec 2021 - the default
                # mirrorlist-based repos are dead, so plain `yum install`
                # silently finds nothing beyond whatever's cached. Repoint
                # at the vault archive so normal installs keep working
                # generically for any future package's dependencies too.
                sudo sed -i \
                  -e 's/^mirrorlist=/#mirrorlist=/' \
                  -e 's/^metalink=/#metalink=/' \
                  -e 's|^#baseurl=http://mirror.centos.org|baseurl=https://vault.centos.org|' \
                  /etc/yum.repos.d/*.repo
              fi

              sudo yum install -y epel-release || true
              sudo yum config-manager --set-enabled powertools 2>/dev/null \
                || sudo yum config-manager --set-enabled PowerTools 2>/dev/null \
                || sudo yum config-manager --set-enabled crb 2>/dev/null \
                || true
              sudo yum install -y \
                rpm-build rpmdevtools createrepo \
                openssl-devel lz4-devel zlib-devel libzstd-devel

              # yum-plugin-priorities only exists on yum3-based repos
              # (EL7/EL8-style) - EL9's dnf doesn't ship it. Our local-
              # build repo only ever contains the exact version a
              # dependent needs, so dnf resolves it correctly even
              # without priority-pinning - this install is best-effort.
              sudo yum install -y yum-plugin-priorities 2>/dev/null || true
            fi
      - run:
          name: Build resolved package(s)
          command: |
            echo "Using PLATFORM_TAG=${PLATFORM_TAG}"
            mkdir -p build/dist_workspace/${PLATFORM_TAG}

            # Parses a "Build-Depends:"/"BuildRequires:" block (comma
            # separated, may wrap to continuation lines) straight out of
            # the raw control/spec file and installs the package names.
            # We do NOT use mk-build-deps/yum-builddep here because those
            # parse the changelog/spec version too - and at this point the
            # VERSION/ZAPPEND template placeholders haven't been
            # substituted yet (that only happens inside the Makefile's own
            # build_deb/build_rpm targets), so they fail on an "unknown"
            # version.
            #
            # NOTE: the pipeline below is wrapped with "|| true" because
            # this whole script runs under `set -eo pipefail` (see the
            # job's `shell:`). When a control/spec file declares NO
            # Build-Depends/BuildRequires at all (e.g. zimbra/osl's
            # .spec, which has no BuildRequires block), `awk` emits
            # nothing and the downstream `grep -v '^$'` then has zero
            # input lines to select - grep exits 1 in that case even
            # though nothing is actually wrong. Under pipefail that
            # non-zero status kills the whole build step immediately
            # (this is exactly what was failing build_c9/build_c8: the
            # step died silently right after "no internal zimbra- deps
            # declared, skipping" with no further output). "|| true"
            # lets deps legitimately come back empty without aborting -
            # the `if [ -n "$deps" ]` guard right below already handles
            # the empty case correctly.
            install_declared_build_deps() {
              file="$1"; label="$2"; prefix="$3"; shift 3
              deps=$(awk -v prefix="$prefix" '
                  $0 ~ "^"prefix":" { flag=1; sub("^"prefix":", ""); print; next }
                  flag && /^[A-Za-z][A-Za-z0-9-]*:/ { flag=0 }
                  flag { print }
                ' "$file" \
                | tr ',' '\n' \
                | sed -E 's/\(.*\)//; s/[<>=!].*//; s/^[[:space:]]+//; s/[[:space:]]+$//' \
                | grep -v '^$' \
                | sort -u || true)

              if [ -n "$deps" ]; then
                echo "Installing ${label} build-deps: ${deps}"
                "$@" $deps
              else
                echo "No ${label} build-deps declared for ${file}, skipping install"
              fi
            }

            while IFS= read -r PKGPATH; do
              echo "=== Building ${PKGPATH} for ${PLATFORM_TAG} ==="

              if [ ! -d "$PKGPATH" ]; then
                echo "ERROR: $PKGPATH does not exist"
                exit 1
              fi

              # --- optional package-owned pre-build hook -----------------
              # Convention: <path>/ci/pre_build.sh
              # Only runs if the package itself ships this file. Package-
              # specific quirks live here, not in this shared config.yml.
              PRE_HOOK="${PKGPATH}/ci/pre_build.sh"
              if [ -x "$PRE_HOOK" ]; then
                echo "=== Running pre-build hook for ${PKGPATH} ==="
                "$PRE_HOOK" "${PLATFORM_TAG}"
              fi

              CONTROL_FILE=$(find "$PKGPATH" -path "*/debian/control" 2>/dev/null | head -1)
              if [ -n "$CONTROL_FILE" ] && command -v apt-get >/dev/null 2>&1; then
                bash ci/verify-build-deps.sh "$CONTROL_FILE" "Build-Depends"
                install_declared_build_deps "$CONTROL_FILE" "Debian" "Build-Depends" \
                  sudo apt-get install -y --no-install-recommends
              fi

              SPEC_FILE=$(find "$PKGPATH" -path "*/SPECS/*.spec" 2>/dev/null | head -1)
              if [ -n "$SPEC_FILE" ] && command -v yum >/dev/null 2>&1; then
                bash ci/verify-build-deps.sh "$SPEC_FILE" "BuildRequires"
                install_declared_build_deps "$SPEC_FILE" "RPM" "BuildRequires" \
                  sudo yum install -y
              fi

              ( cd "$PKGPATH" && make )

              bash ci/register-local-repo.sh "${PKGPATH}/build"

              find "${PKGPATH}/build" -type f \
                \( -name "*.deb" -o -name "*.rpm" \) ! -name "*.src.rpm" \
                -exec cp {} "build/dist_workspace/${PLATFORM_TAG}/" \;
            done < packages_to_build.txt

            echo "=== build/dist_workspace/${PLATFORM_TAG} contents ==="
            ls -la build/dist_workspace/${PLATFORM_TAG}/
      - store_artifacts:
          path: build/dist_workspace
      - persist_to_workspace:
          root: ..
          paths:
            - packages/build/dist_workspace

  # ---------------------------------------------------------------------
  # develop only: publish everything built to Nexus
  # ---------------------------------------------------------------------
  publish_packages_job_steps: &publish_packages_job_steps
    steps:
      - attach_workspace:
          at: ..
      - run:
          name: Publish package artifacts to Nexus
          command: |
            sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl
            bash ../zm-nexus/scripts/publish-packages-to-nexus.sh "build/dist_workspace"

  # ---------------------------------------------------------------------
  # non-develop only: zip everything built and upload to OCI bucket
  # ---------------------------------------------------------------------
  deploy_s3_job_steps: &deploy_s3_job_steps
    docker:
      - image: 'cimg/python:3.10'
    resource_class: small
    steps:
      - attach_workspace:
          at: ..
      - run:
          name: Create a zip file for artifacts and upload them to the OCI bucket
          command: |
            cd build/dist_workspace
            zip -r $CIRCLE_PROJECT_REPONAME.zip .
            ZIP_FILE_PATH="$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/$CIRCLE_BRANCH-$CIRCLE_BUILD_NUM/archives/$CIRCLE_PROJECT_REPONAME.zip"
            curl -X PUT "$OCI_PAR_URL$ZIP_FILE_PATH" -T $CIRCLE_PROJECT_REPONAME.zip
            echo "artifacts uploaded to $ZIP_FILE_PATH"

###########################################################################################################################################################
jobs:
  checkout_and_resolve:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: small
    <<: *checkout_and_resolve_steps

  build_u24:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-24.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: u24
    <<: *build_and_isolate_steps

  build_u22:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: u22
    <<: *build_and_isolate_steps

  build_u20:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-20.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: u20
    <<: *build_and_isolate_steps

  build_u18:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-18.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: u18
    <<: *build_and_isolate_steps

  build_c9:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-centos-9
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: c9
    <<: *build_and_isolate_steps

  build_c8:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-centos-8
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: c8
    <<: *build_and_isolate_steps

  publish_packages:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    circleci_ip_ranges: true
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: small
    <<: *publish_packages_job_steps

  deploy_s3:
    working_directory: ~/packages
    shell: /bin/bash -eo pipefail
    <<: *deploy_s3_job_steps

###########################################################################################################################################################
workflows:
  version: 2

  # -------------------------------------------------------------------------------
  # develop branch: PR merge -> resolve -> build (all platforms) -> publish to Nexus
  # -------------------------------------------------------------------------------
  develop-workflow:
    when: *when_develop_workflow
    jobs:
      - checkout_and_resolve:
          context:
            - docker-dev-registry
      - build_u24:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_u22:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_u20:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_u18:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_c9:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_c8:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - publish_packages:
          requires:
            - build_u24
            - build_u22
            - build_u20
            - build_u18
            - build_c9
            - build_c8
          context:
            - docker-dev-registry
            - nexus-dev-artifactory

  # ----------------------------------------------------------------------------------
  # non-develop / manual trigger: approval -> build -> validate -> approval ->
  # upload to OCI S3 (no Nexus publish)
  # ----------------------------------------------------------------------------------
  main:
    when: *when_main_workflow
    jobs:
      - generate:
          type: approval
      - checkout_and_resolve:
          requires:
            - generate
          context:
            - docker-dev-registry
      - build_u24:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_u22:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_u20:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_u18:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_c9:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - build_c8:
          requires:
            - checkout_and_resolve
          context:
            - docker-dev-registry
      - deploy_s3_hold:
          type: approval
          requires:
            - build_u24
            - build_u22
            - build_u20
            - build_u18
            - build_c9
            - build_c8
      - deploy_s3:
          context:
            - oracle
            - docker-dev-registry
          requires:
            - deploy_s3_hold
